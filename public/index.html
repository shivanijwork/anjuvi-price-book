<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#8e1f5a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anjuvi">
<title>Anjuvi Price Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Yatra+One&display=swap">
<style>
/* Layout: one-column card list of suits (two columns on wide screens), sticky search bar, bottom sheet for add/edit */
:root{
  --bg:#f7f3f5; --surface:#ffffff; --sunk:#efe8ec; --line:#e2d6dd;
  --fg:#2a1f26; --muted:#6f5f69;
  --accent:#8e1f5a; --accent-fg:#ffffff; --accent-soft:#f6e3ed;
  --good:#1d7a4a; --good-soft:#e2f3ea; --warn:#a15c00; --warn-soft:#fbefdc; --bad:#b3261e;
  --display:"Yatra One", "Hind", Georgia, serif;
  --body:"Hind", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1418; --surface:#241c21; --sunk:#2e252b; --line:#3d3238;
  --fg:#f3e9ee; --muted:#b9a7b2;
  --accent:#e77fb2; --accent-fg:#2a0d1c; --accent-soft:#3b2230;
  --good:#6fd39e; --good-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff8a80;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1418; --surface:#241c21; --sunk:#2e252b; --line:#3d3238;
  --fg:#f3e9ee; --muted:#b9a7b2;
  --accent:#e77fb2; --accent-fg:#2a0d1c; --accent-soft:#3b2230;
  --good:#6fd39e; --good-soft:#173326; --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#ff8a80;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:960px;margin:0 auto}
header{padding-block:20px 8px}
h1{font-family:var(--display);font-weight:400;font-size:2rem;margin:0;color:var(--accent);line-height:1.1}
.sub{color:var(--muted);margin:2px 0 0}
.summary{display:flex;flex-wrap:wrap;gap:8px 20px;margin:14px 0 4px;font-size:.95rem;color:var(--muted)}
.summary b{color:var(--fg);font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:10px}
.search{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
.search:focus{outline:none;border-color:var(--accent)}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{font:inherit;font-size:.95rem;padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.list{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;display:grid;grid-template-columns:116px 1fr;gap:14px;padding:12px;min-width:0}
.card.sold{opacity:.62}
.thumb{width:116px;height:150px;border-radius:10px;overflow:hidden;background:var(--sunk);border:0;padding:0;cursor:zoom-in;display:block}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ph{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.85rem;text-align:center;padding:6px}
.info{min-width:0;display:flex;flex-direction:column;gap:6px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.code{font-weight:700;font-size:1.05rem;color:var(--accent);letter-spacing:.02em}
.pill{font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--good-soft);color:var(--good)}
.pill.sold{background:var(--sunk);color:var(--muted)}
.name{margin:0;font-size:1rem;font-weight:500;overflow-wrap:anywhere}
.rows{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font-variant-numeric:tabular-nums}
.rows dt{color:var(--muted);font-size:.92rem}
.rows dd{margin:0;font-weight:600;text-align:right}
.profit{display:flex;justify-content:space-between;align-items:baseline;gap:8px;background:var(--good-soft);color:var(--good);border-radius:10px;padding:6px 10px;font-variant-numeric:tabular-nums}
.profit.low{background:var(--warn-soft);color:var(--warn)}
.profit.neg{background:var(--warn-soft);color:var(--bad)}
.profit b{font-size:1.15rem}
.online{font-size:.9rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.online b{color:var(--fg);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.btn{font:inherit;font-size:.95rem;font-weight:600;padding:8px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn:focus-visible,.tab:focus-visible,.thumb:focus-visible,.fab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;font:inherit;font-size:1.1rem;font-weight:700;padding:14px 22px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-fg);box-shadow:0 6px 20px rgba(60,10,35,.28);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:2px dashed var(--line);border-radius:16px;margin-top:10px}
.note{font-size:.9rem;color:var(--muted);margin:8px 0}
/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,8,15,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding-block:18px calc(env(safe-area-inset-bottom,0px) + 18px);padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media (min-width:600px){.overlay{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:1.5rem;margin:0 0 12px;color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-weight:600}
.field small{color:var(--muted)}
.field input[type=text],.field input[type=number]{font:inherit;font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
.field input:focus{outline:none;border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .prev{width:72px;height:92px;border-radius:8px;background:var(--sunk);overflow:hidden;flex:none}
.photo-pick .prev img{width:100%;height:100%;object-fit:cover}
.live{background:var(--good-soft);color:var(--good);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-weight:600;font-variant-numeric:tabular-nums}
.live.neg{background:var(--warn-soft);color:var(--bad)}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between}
.err{color:var(--bad);font-weight:600;margin:6px 0}
.confirm{background:var(--warn-soft);border-radius:10px;padding:10px 12px;margin-top:10px}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(10,4,8,.92);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.viewer img{max-height:100%;max-width:100%;border-radius:8px}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:12px}
.login h1{text-align:center}
.login input{font:inherit;font-size:1.15rem;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.login input:focus{outline:none;border-color:var(--accent)}
.linkbtn{background:none;border:0;color:var(--muted);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer;padding:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:40;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<div id="loginView" hidden>
  <form class="login" id="loginForm">
    <h1>Anjuvi Price Book</h1>
    <label for="pw">Password daalo</label>
    <input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="loginErr" hidden></p>
    <button class="btn primary" type="submit" id="loginBtn">Kholo</button>
  </form>
</div>

<div class="wrap" id="appView" hidden>
  <header>
    <h1>Anjuvi Price Book</h1>
    <p class="sub">Har suit ki khareed, bikri aur munafa ek jagah · <button class="linkbtn" id="logout">Logout</button></p>
    <div class="summary" id="summary"></div>
  </header>
  <div class="bar">
    <input id="q" class="search" type="search" placeholder="Code ya naam likho, jaise S-07 ya green" aria-label="Suit dhundho">
    <div class="tabs" role="group" aria-label="Filter">
      <button class="tab" data-f="left" aria-pressed="true">Bache hue</button>
      <button class="tab" data-f="sold" aria-pressed="false">Bik gaye</button>
      <button class="tab" data-f="all" aria-pressed="false">Sab</button>
    </div>
  </div>
  <p class="note" id="status">Suits load ho rahe hain…</p>
  <div class="list" id="list"></div>
</div>
<button class="fab" id="addBtn" hidden>➕ Naya Suit Jodo</button>
<div id="layer"></div>

<script>
const $=s=>document.querySelector(s);
const rupee=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const num=v=>{const x=parseFloat(v);return isFinite(x)?x:null};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let suits=[], filter="left", query="";

async function api(path,opts={}){
  const r=await fetch(path,{credentials:"same-origin",headers:{"Content-Type":"application/json"},...opts,body:opts.body?JSON.stringify(opts.body):undefined});
  if(r.status===401){showLogin();throw {code:"login"}}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw {code:j.error||("http_"+r.status),detail:j.detail||"",step:path.split("?")[0]};
  return j;
}

function showLogin(){$("#appView").hidden=true;$("#addBtn").hidden=true;$("#loginView").hidden=false;setTimeout(()=>$("#pw").focus(),50)}
function showApp(){$("#loginView").hidden=true;$("#appView").hidden=false;$("#addBtn").hidden=false}

$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const err=$("#loginErr"),btn=$("#loginBtn");err.hidden=true;btn.disabled=true;
  try{
    const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("#pw").value})});
    if(!r.ok){err.textContent=r.status===401?"Password galat hai, dobara try karo.":"Abhi login nahi ho paya, thodi der baad try karo.";err.hidden=false;return}
    $("#pw").value="";await load();
  }catch(x){err.textContent="Internet check karo aur dobara try karo.";err.hidden=false}
  finally{btn.disabled=false}
});
$("#logout").onclick=async()=>{try{await fetch("/api/login",{method:"DELETE"})}catch(e){}showLogin()};

async function load(){
  try{const j=await api("/api/suits");suits=j.suits;showApp();$("#status").hidden=true;render()}
  catch(e){if(e.code!=="login"){$("#status").hidden=false;$("#status").textContent="Suits load nahi hue. Internet check karke page refresh karo.";showApp()}}
}

function calc(s){
  const p=s.sp-s.cp, m=s.sp?p/s.sp*100:0;
  let op=null, om=null;
  if(s.online_sp){op=s.online_sp-s.cp-(s.online_cost||0); om=op/s.online_sp*100}
  return {p,m,op,om};
}
const codeOf=s=>"S-"+String(s.num).padStart(2,"0");

function render(){
  const left=suits.filter(s=>!s.sold);
  const totP=left.reduce((a,s)=>a+(s.sp-s.cp),0), totCp=left.reduce((a,s)=>a+s.cp,0);
  $("#summary").innerHTML=suits.length?
    `<span>Bache suit: <b>${left.length}</b></span><span>Stock ki khareed: <b>${rupee(totCp)}</b></span><span>Sab bike toh munafa: <b>${rupee(totP)}</b></span>`:"";
  const q=query.trim().toLowerCase();
  const shown=suits.filter(s=>filter==="all"||(filter==="sold"?s.sold:!s.sold))
    .filter(s=>!q||codeOf(s).toLowerCase().includes(q)||(s.name||"").toLowerCase().includes(q)||String(s.num)===q.replace(/^s-?0*/,""));
  const list=$("#list"); list.innerHTML="";
  if(!shown.length){
    list.innerHTML=`<div class="empty">${suits.length?"Is filter mein koi suit nahi mila.":"Abhi koi suit nahi hai. Neeche “Naya Suit Jodo” dabakar pehla suit jodo."}</div>`;
    return;
  }
  for(const s of shown){
    const c=calc(s), el=document.createElement("article");
    el.className="card"+(s.sold?" sold":"");
    const url=s.photo_url;
    const cls=c.p<0?"neg":(c.m<20?"low":"");
    el.innerHTML=`
      <button class="thumb" aria-label="Photo badi karo">${url?`<img loading="lazy" alt="" src="${esc(url)}">`:`<div class="ph">Photo nahi</div>`}</button>
      <div class="info">
        <div class="top"><span class="code">${codeOf(s)}</span>${s.sold?'<span class="pill sold">Bik gaya</span>':''}</div>
        <p class="name">${esc(s.name)}</p>
        <dl class="rows">
          <dt>Khareed (CP)</dt><dd>${rupee(s.cp)}</dd>
          <dt>Bikri (Retail SP)</dt><dd>${rupee(s.sp)}</dd>
        </dl>
        <div class="profit ${cls}"><span>Munafa</span><span><b>${rupee(c.p)}</b> · ${c.m.toFixed(0)}%</span></div>
        <div class="online">${s.online_sp?`Online: <b>${rupee(s.online_sp)}</b>${s.online_cost?` (kharcha ${rupee(s.online_cost)})`:""} → munafa <b>${rupee(c.op)}</b> · ${c.om.toFixed(0)}%`:"Online rate: abhi tay nahi"}</div>
        <div class="actions"><button class="btn" data-a="edit">Badlo</button><button class="btn" data-a="sold">${s.sold?"Wapas stock mein":"Bik gaya ✓"}</button></div>
      </div>`;
    const img=el.querySelector(".thumb img");
    if(img)img.onerror=()=>{img.replaceWith(Object.assign(document.createElement("div"),{className:"ph",textContent:"Photo nahi mili"}))};
    el.querySelector(".thumb").onclick=()=>url&&openViewer(url);
    el.querySelector('[data-a="edit"]').onclick=()=>openForm(s);
    el.querySelector('[data-a="sold"]').onclick=e=>toggleSold(s,e.currentTarget);
    list.appendChild(el);
  }
}

function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function openViewer(url){
  const v=document.createElement("div");v.className="viewer";
  const im=document.createElement("img");im.alt="Suit ki photo";im.src=url;v.appendChild(im);
  v.onclick=()=>v.remove();$("#layer").appendChild(v);
}
function replaceSuit(s){const i=suits.findIndex(x=>x.id===s.id);if(i>=0)suits[i]=s;else suits.push(s);suits.sort((a,b)=>a.num-b.num);render()}

async function toggleSold(s,btn){
  btn.disabled=true;
  try{const j=await api("/api/suits?id="+s.id,{method:"PATCH",body:{sold:!s.sold}});replaceSuit(j.suit);toast(s.sold?"Wapas stock mein":"Bik gaya likh diya")}
  catch(e){if(e.code!=="login")toast("Save nahi hua, dobara try karo");btn.disabled=false}
}

async function shrinkToBase64(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){bmp=await createImageBitmap(file)}
  const sc=Math.min(1,1200/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.8).split(",")[1];
}

function openForm(s){
  const isNew=!s;
  const nextNum=suits.reduce((a,x)=>Math.max(a,x.num||0),0)+1;
  const ov=document.createElement("div");ov.className="overlay";
  ov.innerHTML=`<form class="sheet" novalidate>
    <h2>${isNew?"Naya suit · S-"+String(nextNum).padStart(2,"0"):"Badlo · "+codeOf(s)}</h2>
    <div class="field"><label for="f-photo">Photo</label>
      <div class="photo-pick"><div class="prev" id="prev">${s&&s.photo_url?`<img alt="" src="${esc(s.photo_url)}">`:""}</div>
      <div><input id="f-photo" type="file" accept="image/*"><br><small>Photo khincho ya gallery se chuno</small></div></div></div>
    <div class="field"><label for="f-name">Naam / pehchaan</label><input id="f-name" type="text" placeholder="Jaise: Pink kadhai wala"></div>
    <div class="two">
      <div class="field"><label for="f-cp">Khareed (CP) ₹</label><input id="f-cp" type="number" inputmode="numeric" min="0"></div>
      <div class="field"><label for="f-sp">Bikri (Retail SP) ₹</label><input id="f-sp" type="number" inputmode="numeric" min="0"></div>
    </div>
    <div class="live" id="live">CP aur SP daalo, munafa yahan dikhega</div>
    <div class="two">
      <div class="field"><label for="f-osp">Online SP ₹</label><input id="f-osp" type="number" inputmode="numeric" min="0"><small>Khaali chhod sakte ho</small></div>
      <div class="field"><label for="f-oc">Online kharcha ₹</label><input id="f-oc" type="number" inputmode="numeric" min="0"><small>Commission + shipping</small></div>
    </div>
    <p class="err" id="err" hidden></p>
    <div class="sheet-actions">
      <div style="display:flex;gap:10px"><button class="btn primary" type="submit" id="save">Save karo</button><button class="btn" type="button" id="cancel">Wapas</button></div>
      ${isNew?"":`<button class="btn danger" type="button" id="del">Hatao</button>`}
    </div>
    <div id="confirmBox"></div>
  </form>`;
  $("#layer").appendChild(ov);
  const f=ov.querySelector("form"), g=id=>f.querySelector("#"+id);
  if(s){g("f-name").value=s.name||"";g("f-cp").value=s.cp;g("f-sp").value=s.sp;
    if(s.online_sp)g("f-osp").value=s.online_sp; if(s.online_cost)g("f-oc").value=s.online_cost;}
  let file=null;
  const live=()=>{const cp=num(g("f-cp").value),sp=num(g("f-sp").value),L=g("live");
    if(cp!=null&&sp){const p=sp-cp;L.textContent=`Munafa ${rupee(p)} · Margin ${(p/sp*100).toFixed(0)}%`;L.className="live"+(p<0?" neg":"")}
    else{L.textContent="CP aur SP daalo, munafa yahan dikhega";L.className="live"}};
  f.addEventListener("input",live);live();
  g("f-photo").onchange=e=>{file=e.target.files[0]||null;if(file){const im=document.createElement("img");im.alt="";im.src=URL.createObjectURL(file);g("prev").replaceChildren(im)}};
  const close=()=>ov.remove();
  g("cancel").onclick=close;
  ov.addEventListener("click",e=>{if(e.target===ov)close()});
  g("del")?.addEventListener("click",()=>{
    const b=g("confirmBox");
    b.innerHTML=`<div class="confirm">${codeOf(s)} ko hamesha ke liye hata dein? <div class="actions" style="margin-top:8px"><button class="btn danger" type="button" id="yes">Haan, hatao</button><button class="btn" type="button" id="no">Nahi</button></div></div>`;
    b.querySelector("#no").onclick=()=>b.innerHTML="";
    b.querySelector("#yes").onclick=async()=>{try{await api("/api/suits?id="+s.id,{method:"DELETE"});suits=suits.filter(x=>x.id!==s.id);render();close();toast("Hata diya")}catch(e){if(e.code!=="login")toast("Hata nahi paaye, dobara try karo")}};
  });
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const err=g("err");err.hidden=true;
    const cp=num(g("f-cp").value),sp=num(g("f-sp").value);
    if(cp==null||!sp){err.textContent="Khareed aur Bikri dono rate daalna zaroori hai.";err.hidden=false;return}
    if(isNew&&!file){err.textContent="Suit ki photo jodo, taaki pehchaan rahe.";err.hidden=false;return}
    const btn=g("save");btn.disabled=true;btn.textContent="Save ho raha hai…";
    try{
      let photo_url=s?.photo_url||null;
      if(file){const up=await api("/api/upload",{method:"POST",body:{data:await shrinkToBase64(file)}});photo_url=up.url}
      const body={name:g("f-name").value.trim(),cp,sp,online_sp:num(g("f-osp").value),online_cost:num(g("f-oc").value),photo_url};
      const j=isNew?await api("/api/suits",{method:"POST",body}):await api("/api/suits?id="+s.id,{method:"PATCH",body});
      replaceSuit(j.suit);close();toast(isNew?"Naya suit jud gaya":"Badlav save ho gaya");
    }catch(x){
      if(x.code==="login"){close();return}
      const why=x.code==="too_large"?"Photo bahut badi hai, chhoti photo chuno."
        :x.code==="blob_not_connected"?"Photo storage (Vercel Blob) juda nahi hai."
        :x.step==="/api/upload"?"Photo upload nahi hui."
        :x.step==="/api/suits"?"Suit database mein save nahi hua."
        :"Save nahi hua. Internet check karke dobara try karo.";
      err.textContent=why+" ["+(x.code||x.name||"error")+(x.detail||x.message?": "+(x.detail||x.message):"")+"]";
      err.hidden=false;btn.disabled=false;btn.textContent="Save karo";
    }
  });
}

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{filter=t.dataset.f;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-pressed",x===t));render()});
$("#q").addEventListener("input",e=>{query=e.target.value;render()});
$("#addBtn").onclick=()=>openForm(null);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!$("#appView").hidden&&!$("#layer").children.length)load()});
load();
</script>
</body>
